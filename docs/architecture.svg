<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
  <title id="title">Task Memory API architecture</title>
  <desc id="desc">Local client requests pass through Express routes and validation to Prisma and SQLite. A reminder job uses a delivery record uniqueness constraint to prevent duplicate sends during retries.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#17212b}.h{font-size:22px;font-weight:700}.b{font-size:16px}.s{font-size:13px;fill:#4d5a68}.box{fill:#f6f9fc;stroke:#4f7cac;stroke-width:2}.guard{fill:#edf7ed;stroke:#4c8b55;stroke-width:2}.arrow{stroke:#4f7cac;stroke-width:3;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4f7cac"/></marker></defs>
  <rect width="1000" height="330" fill="#ffffff"/>
  <text x="40" y="38" class="h">Task Memory API — local architecture</text>
  <rect x="40" y="90" width="180" height="100" rx="12" class="box"/><text x="74" y="132" class="b">Local client</text><text x="62" y="158" class="s">REST / JSON requests</text>
  <line x1="220" y1="140" x2="320" y2="140" class="arrow"/>
  <rect x="330" y="75" width="220" height="130" rx="12" class="box"/><text x="375" y="120" class="b">Express routes</text><text x="360" y="147" class="s">validation · response shaping</text><text x="375" y="171" class="s">memories · tasks · events</text>
  <line x1="550" y1="140" x2="650" y2="140" class="arrow"/>
  <rect x="660" y="75" width="140" height="130" rx="12" class="box"/><text x="700" y="125" class="b">Prisma</text><text x="682" y="152" class="s">data model</text>
  <line x1="800" y1="140" x2="880" y2="140" class="arrow"/>
  <rect x="885" y="75" width="85" height="130" rx="12" class="box"/><text x="898" y="125" class="b">SQLite</text><text x="897" y="152" class="s">local DB</text>
  <rect x="290" y="235" width="550" height="62" rx="10" class="guard"/>
  <text x="325" y="262" class="b">Reminder job: compound uniqueness guard on delivery records</text>
  <text x="325" y="284" class="s">Prevents duplicate sends when reminder processing is retried.</text>
</svg>
