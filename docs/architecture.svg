<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
  <title id="title">Task Memory API architecture</title>
  <desc id="desc">Local client requests pass through Express routes and validation to Prisma and SQLite. A reminder job uses a delivery record uniqueness constraint to prevent duplicate sends during retries.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#17212b;text-anchor:middle}.h{font-size:22px;font-weight:700}.b{font-size:16px;font-weight:700}.s{font-size:13px;fill:#52606d}.box{fill:#f8fbff;stroke:#4f7cac;stroke-width:2}.guard{fill:#f0f8f1;stroke:#4c8b55;stroke-width:2}.arrow{fill:none;stroke:#4f7cac;stroke-width:3;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4f7cac"/></marker></defs>
  <rect width="1000" height="330" fill="#ffffff"/>
  <rect x="1" y="1" width="998" height="328" rx="12" fill="none" stroke="#d0d7de"/>
  <text x="500" y="48" class="h">Task Memory API — local architecture</text>
  <line x1="205" y1="156" x2="275" y2="156" class="arrow"/>
  <line x1="510" y1="156" x2="590" y2="156" class="arrow"/>
  <line x1="750" y1="156" x2="825" y2="156" class="arrow"/>
  <rect x="55" y="106" width="150" height="100" rx="14" class="box"/><text x="130" y="149" class="b">Local client</text><text x="130" y="174" class="s">REST / JSON requests</text>
  <rect x="275" y="91" width="235" height="130" rx="14" class="box"/><text x="392.5" y="137" class="b">Express routes</text><text x="392.5" y="164" class="s">validation · response shaping</text><text x="392.5" y="188" class="s">memories · tasks · events</text>
  <rect x="590" y="106" width="160" height="100" rx="14" class="box"/><text x="670" y="149" class="b">Prisma</text><text x="670" y="174" class="s">data model</text>
  <rect x="825" y="106" width="120" height="100" rx="14" class="box"/><text x="885" y="149" class="b">SQLite</text><text x="885" y="174" class="s">local DB</text>
  <rect x="220" y="246" width="560" height="58" rx="12" class="guard"/>
  <text x="500" y="270" class="b">Reminder job: compound uniqueness guard on delivery records</text>
  <text x="500" y="291" class="s">Prevents duplicate sends when reminder processing is retried.</text>
</svg>
